<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerte sécurité – Escape game HSE</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf1;--card:#fff;--tx:#14212e;--mut:#5a6877;--ac:#f2b705;--nav:#0d2840;--ok:#1b7f4b;--ko:#c4382f;--bd:#c9d2db;--fl:#dfe5eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141c;--card:#15222d;--tx:#e6edf3;--mut:#93a3b2;--bd:#2a3a48;--nav:#071a2a;--fl:#1a2a37;--ok:#3fb273;--ko:#ef6a60;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141c;--card:#15222d;--tx:#e6edf3;--mut:#93a3b2;--bd:#2a3a48;--nav:#071a2a;--fl:#1a2a37;--ok:#3fb273;--ko:#ef6a60;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:.2em 0;letter-spacing:.01em}
h1{font-size:2.4rem;line-height:1.05}h2{font-size:1.7rem}h3{font-size:1.3rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--nav);color:#fff;padding:8px 14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#tm{font:700 1.6rem "Barlow Condensed",sans-serif;background:var(--ac);color:#14212e;padding:0 10px;border-radius:6px}
#tm.late{background:var(--ko);color:#fff}
.dg{display:flex;gap:4px;margin-left:auto}.dg b{width:26px;height:30px;display:grid;place-items:center;background:#fff;color:#14212e;border-radius:4px;font-size:1.1rem}
nav{display:flex;gap:6px;margin-top:8px}
nav button{background:transparent;color:#fff;border:1px solid #fff6;padding:4px 12px}
nav button.on{background:#fff;color:#0d2840}nav button:disabled{opacity:.4}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
.card.ok{border-color:var(--ok)}
button{font:600 1rem Barlow,sans-serif;background:var(--ac);color:#14212e;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;margin:4px 4px 4px 0}
button:focus-visible,input:focus-visible,.cd:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);width:7.5em}
input.w{width:min(100%,14em)}input.k{width:2.4em;text-align:center;font-size:1.5rem}
.ok{color:var(--ok)}.ko{color:var(--ko)}.mut{color:var(--mut);font-size:.92rem}
.sc{width:100%;height:auto;display:block}
.hs{cursor:pointer}.hs rect{fill:var(--card);stroke:var(--bd);stroke-width:2}
.hs text{fill:var(--tx)}
.hs rect.md{stroke:var(--ko);stroke-width:4}.hs rect.mc{stroke:var(--ok);stroke-width:4}.hs rect.sl{stroke:var(--ac);stroke-width:5}
.cd{border:2px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:var(--bg)}
.cd.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 22%,var(--card))}
table{border-collapse:collapse;margin:6px 0}td,th{border:1px solid var(--bd);padding:3px 9px;text-align:left}
#tst{background:var(--ac);color:#14212e;padding:8px 14px;font-weight:600;cursor:pointer}
#tst:empty{display:none}
.carnet{background:var(--nav);color:#fff;font-size:.9rem;padding:4px 14px}
.lock{opacity:.75;border-style:dashed}
.cert{border:3px double var(--ac);text-align:center;padding:16px;border-radius:10px;margin:12px 0}
.sit{border-top:1px solid var(--bd);padding-top:8px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .3s}}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
#bg img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:150px;object-fit:cover;border-radius:8px;display:block;margin:6px 0}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:8px 0}
.tl{border:2px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg)}.tl.a{border-color:var(--ok)}.tl.i{border-color:var(--ko)}
#bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.55}
main>h1,main>h2,main>p{background:var(--bg);display:inline-block;padding:2px 10px;border-radius:6px}
.ic{display:flex;gap:14px;align-items:center;color:var(--mut)}.ic svg{height:26px;width:auto}
.carnet{display:flex;justify-content:space-between;align-items:center;gap:10px}.carnet[hidden]{display:none}.carnet .ic{color:#fff}.carnet .ic svg{height:20px}
</style>
</head>

function phase2(){let h='<div class="card"><h3>Phase 2 — Sécurisez la zone</h3>'+ph('d')+'<p>Une maintenance va commencer sous une charge suspendue, avec des engins à proximité. Touchez les mesures dans le bon ordre.</p>';

function posteB(){return '<div class="card"><h3>Poste B — Le calcul qui évite l’accident</h3>'+ph('b')+'<p>Un opérateur doit déplacer une pièce d’acier avec un pont roulant. L’équipe HSE vérifie que le matériel supporte la charge.</p><p><b>La pièce :</b> longueur 2 m · largeur 1 m · épaisseur 5 cm · acier 7 850 kg/m³ · accessoires fixés : 100 kg</p><table><tr><th>Matériel</th><th>CMU (charge maximale d’utilisation)</th></tr><tr><td>Élingue A</td><td>1 000 kg</td></tr><tr><td>Élingue B</td><td>2 000 kg</td></tr><tr><td>Palonnier</td><td>2 500 kg</td></tr><tr><td>Pont roulant</td><td>3 000 kg</td></tr></table><p class="mut">Volume = longueur × largeur × épaisseur ; masse = volume × masse volumique.</p><p>1. Masse de la pièce (kg) : <input id="b1" inputmode="decimal"></p><p>2. Masse totale à soulever (kg) : <input id="b2" inputmode="decimal"></p><p>3. Quel est le chiffre des centaines de la masse totale ? <input id="b3" inputmode="numeric"></p><button onclick="cB()">Vérifier</button><p id="bf" class="ko"></p></div>'}
function cB(){const a=+$('#b1').value,b=+$('#b2').value,c=$('#b3').value.trim();

 else if(c!=='8')say('bf','Regardez bien le chiffre des centaines de la masse totale.');

const CP=[['🌊','Ballast avant',17.8,0],['⚙️','Local machines',20.9,2],['🛢️','Soute',20.6,18],['💧','Cuve d’eau douce',20.8,0],['🛠️','Compartiment moteur',24.2,0],['📦','Cale arrière',20.1,6]];

 if(w){say('n3f',(w===1?'Un compartiment est mal classé.':w+' compartiments sont mal classés.')+' Vérifiez à nouveau chaque mesure avec la règle.');return}

function phase3(){
 if(S.dg[4]!=null)return '<div class="card ok"><b>✅ Phase 3 validée</b> — 3 compartiments sur 6 pouvaient être ouverts. Restaient interdits : le ballast avant (manque d’oxygène), la soute (gaz inflammables) et le compartiment moteur (trop d’oxygène : risque d’incendie). Avant d’entrer : <b>mesurer, ventiler, surveiller</b>, avec un secours prévu. Chiffre n°5 : <b>3</b></div>';
 if(S.dg[3]==null)return '<div class="card lock"><h3>🔒 Phase 3 — Permis d’entrer à bord</h3><p class="mut">Un bâtiment est à quai pour sa maintenance et des opérateurs doivent entrer dans des compartiments fermés : à vous de décider lesquels peuvent être ouverts. S’ouvre quand la phase 2 est terminée.</p></div>';

 CP.forEach((c,i)=>{const m=S.cm[i];h+='<div class="tl'+(m===1?' a':m===0?' i':'')+'"><div style="font-size:2rem">'+c[0]+'</div><b>'+c[1]+'</b><br>O₂ : '+fr(c[2])+' % · Gaz : '+c[3]+' % LIE<br><button onclick="dc('+i+',1)">✅ Autoriser</button><button onclick="dc('+i+',0)">⛔ Interdire</button></div>'});
 h+='</div>';
 if(S.p3)h+='<p>Combien de compartiments peuvent être ouverts ? <input id="n1" inputmode="numeric"> <button onclick="ans(\'n1\',4,3,\'Comptez les compartiments marqués « Autoriser ».\')">Valider</button></p><p id="n1f" class="ko"></p>';
 else h+='<button onclick="cN()">Valider le permis</button><p id="n3f" class="ko"></p>';

function vF(){const t=fmt(el());return '<div class="card ok"><h1>🎉 Coffre ouvert !</h1><div class="ic">'+ICR()+'</div></div>'+
 '<div class="cert"><h1 style="letter-spacing:.14em">DUERP</h1><p><b>Document Unique d’Évaluation des Risques Professionnels</b></p><p>C’est le document où l’entreprise note les dangers du travail, mesure les risques pour les salariés et prévoit comment les éviter.</p></div>'+
 '<div class="card"><p>Vous avez repéré des dangers, calculé pour décider, vérifié les règles, sécurisé une zone et contrôlé l’air avant d’entrer. Votre objectif en HSE : <b>éviter l’accident avant qu’il arrive.</b></p></div>'+
 '<div class="cert"><h2>Certificat HSE</h2><p>Équipe <b>'+(S.team||'sans nom')+'</b></p><p>Mission accomplie en <b>'+t+'</b> avec '+(3-S.jk)+' indice(s) utilisé(s).</p></div>'+
 '<details class="card"><summary><b>Débrief en 5 questions</b></summary><ol><li>Danger ou risque ? Un câble dénudé est un danger ; le risque, c’est la probabilité de s’électriser × la gravité.</li><li>Pourquoi ajoute-t-on les accessoires ? La CMU s’applique à tout ce qui est soulevé.</li><li>« Éteint », est-ce « sécurisé » ? Non : seule la procédure de mise en sécurité prouve l’absence de danger.</li><li>Pourquoi les EPI viennent-ils en dernier ? On protège d’abord collectivement, car l’EPI ne protège que celui qui le porte.</li><li>Pourquoi mesure-t-on l’air avant d’entrer dans un compartiment ? Un air sans odeur peut manquer d’oxygène ou être explosif : on mesure, on ventile, on surveille, et on prévoit le secours.</li></ol></details><p class="mut">Situation fictive créée pour l’escape game. Elle ne représente pas un atelier réel de Naval Group.</p><button onclick="location.reload()">Rejouer</button>'}
